name: Publicar Mandatín Juegos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Preparar los tres juegos
        run: |
          unzip -q Mandatin-Juegos-GitHub.zip -d site
          test -s site/index.html
          test -s site/game.html
          test -s site/oraciones.html
          test -s site/postit-jump/index.html
          test -s site/copa-mandatin/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
